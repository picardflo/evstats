services:
  evstats-api:
    build: ./backend
    container_name: evstats-api
    restart: unless-stopped
    volumes:
      - evstats_data:/app/data
      - ./VERSION:/app/VERSION:ro

  evstats-frontend:
    build: ./frontend
    container_name: evstats-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - evstats-api

volumes:
  evstats_data:
